<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Leadyia Bot</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
    }

    #chat {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #header {
      padding: 12px;
      background: var(--primary-color, #4f46e5);
      color: #fff;
      font-weight: bold;
      text-align: center;
    }

    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #f9fafb;
    }

    .message {
      margin-bottom: 10px;
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .user {
      background: #4f46e5;
      color: #fff;
      margin-left: auto;
      text-align: right;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
    }

    #input {
      display: flex;
      border-top: 1px solid #e5e7eb;
    }

    #input input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    #input button {
      padding: 12px 16px;
      background: var(--primary-color, #4f46e5);
      color: #fff;
      border: none;
      cursor: pointer;
    }

    #loading {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      display: none;
    }
  </style>
</head>

<body>
  <div id="chat">
    <div id="header">Leadyia Bot</div>

    <div id="messages"></div>

    <div id="loading">Digitando...</div>

    <div id="input">
      <input id="messageInput" placeholder="Digite sua mensagem..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script>
    // -----------------------------
    // CONFIG INICIAL
    // -----------------------------
    const params = new URLSearchParams(window.location.search);

    const apiKey = params.get('apiKey');
    const origin = params.get('origin');
    const apiUrl = 'https://leadyia.onrender.com';

    const sessionId = crypto.randomUUID();
    const language = navigator.language || 'pt-BR';

    if (!apiKey) {
      document.body.innerHTML = '<p>API Key inválida</p>';
      throw new Error('API Key não encontrada');
    }

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const loadingEl = document.getElementById('loading');
    const headerEl = document.getElementById('header');

    // -----------------------------
    // HELPERS
    // -----------------------------
    function addMessage(text, from) {
      const div = document.createElement('div');
      div.className = `message ${from}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setLoading(show) {
      loadingEl.style.display = show ? 'block' : 'none';
    }

    // -----------------------------
    // INIT (HANDSHAKE)
    // -----------------------------
    async function initWidget() {
      try {
        const res = await fetch(`${apiUrl}/api/widget/init`, {
          headers: {
            'x-api-key': apiKey,
            'x-origin': origin
          }
        });

        if (!res.ok) throw new Error('Falha ao inicializar widget');

        const config = await res.json();

        // Branding
        headerEl.textContent = config.botName || 'Leadyia Bot';
        document.documentElement.style.setProperty(
          '--primary-color',
          config.primaryColor || '#4f46e5'
        );

        // Mensagem inicial
        addMessage(config.welcomeMessage || 'Olá! Posso te ajudar?', 'bot');
      } catch (err) {
        addMessage('Erro ao carregar o chat.', 'bot');
        console.error(err);
      }
    }

    // -----------------------------
    // SEND MESSAGE
    // -----------------------------
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      inputEl.value = '';
      setLoading(true);

      try {
        const res = await fetch(`${apiUrl}/api/chat/message`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey
          },
          body: JSON.stringify({
            message: text,
            sessionId,
            language
          })
        });

        const data = await res.json();
        addMessage(data.reply || 'Erro ao responder', 'bot');
      } catch (err) {
        addMessage('Erro de conexão.', 'bot');
      } finally {
        setLoading(false);
      }
    }

    // -----------------------------
    // EVENTS
    // -----------------------------
    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // -----------------------------
    // START
    // -----------------------------
    initWidget();
  </script>
</body>
</html>

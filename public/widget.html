<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Leadyia Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fff;
    }

    #chat {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #header {
      padding: 12px;
      background: var(--primary-color, #4f46e5);
      color: #fff;
      text-align: center;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #f9fafb;
    }

    .message {
      margin-bottom: 10px;
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .user {
      background: #4f46e5;
      color: #fff;
      margin-left: auto;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
    }

    #input {
      display: flex;
      border-top: 1px solid #e5e7eb;
    }

    #input input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    #input button {
      padding: 12px 16px;
      background: var(--primary-color, #4f46e5);
      color: #fff;
      border: none;
      cursor: pointer;
    }

    #loading {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      display: none;
      padding: 6px;
    }
  </style>
</head>

<body>
  <div id="chat">
    <div id="header">Leadyia Bot</div>
    <div id="messages"></div>
    <div id="loading">Digitando...</div>

    <div id="input">
      <input id="messageInput" placeholder="Digite sua mensagem..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script>
    /* ===============================
     * CONFIGURAÇÃO
     * =============================== */
    const params = new URLSearchParams(window.location.search);
    const apiKey = params.get("apiKey");
    const apiUrl = "https://leadyia.onrender.com";

    if (!apiKey) {
      document.body.innerHTML = "<p>API Key inválida</p>";
      throw new Error("API Key ausente");
    }

    const sessionId = crypto.randomUUID();
    const language = navigator.language || "pt-BR";

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const loadingEl = document.getElementById("loading");
    const headerEl = document.getElementById("header");

    /* ===============================
     * HELPERS
     * =============================== */
    function addMessage(text, from) {
      const div = document.createElement("div");
      div.className = `message ${from}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setLoading(show) {
      loadingEl.style.display = show ? "block" : "none";
    }

    /* ===============================
     * INIT WIDGET
     * =============================== */
    async function initWidget() {
      try {
        const res = await fetch(`${apiUrl}/api/widget/init`, {
          headers: {
            "x-api-key": apiKey
          }
        });

        if (!res.ok) throw new Error("Init failed");

        const config = await res.json();

        headerEl.textContent = config.botName || "Leadyia Bot";

        document.documentElement.style.setProperty(
          "--primary-color",
          config.primaryColor || "#4f46e5"
        );

        addMessage(
          config.welcomeMessage || "Olá! Como posso ajudar?",
          "bot"
        );
      } catch (err) {
        console.error(err);
        addMessage("⚠️ Erro ao iniciar o chat.", "bot");
      }
    }

    /* ===============================
     * SEND MESSAGE
     * =============================== */
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      setLoading(true);

      try {
        const res = await fetch(`${apiUrl}/api/chat/message`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey
          },
          body: JSON.stringify({
            message: text,
            sessionId,
            language
          })
        });

        if (!res.ok) throw new Error("Chat error");

        const data = await res.json();
        addMessage(data.reply, "bot");
      } catch (err) {
        console.error(err);
        addMessage("⚠️ Não consegui responder agora.", "bot");
      } finally {
        setLoading(false);
      }
    }

    sendBtn.onclick = sendMessage;
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    initWidget();
  </script>
</body>
</html>
